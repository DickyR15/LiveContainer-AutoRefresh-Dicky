name: Build LiveContainer 3.8.10 AutoRefresh

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: livecontainer-3810-autorefresh
  cancel-in-progress: true

env:
  LIVE_CONTAINER_REF: 4dbe0f9a626de801184a42c0be8d2cb105058e3d
  SIDESTORE_REF: 0dd743f75afc358b0ba4a002feb5f19474492371
  MINIMUXER_REF: 12be70dc2627307a16bfd2dc7a009080d5bec909
  SIDESIGN_REF: 6b68651697f99791ef85404b7aea1891a26a285d
  # SideStore/minimuxer 2026-09 nightly requires the pairable-host + RPPairing option FFI added after 0.1.66.
  IDEVICE_REF: 3e55c8486b2057e40c1f74aaaa1155c82341cf76
  JKTCP_REF: e674e1eee6d5943e13b1eba0bd24a9dd0b2fa020
  AUTO_REFRESH_REF: 35c6c28c98e7261afe6049a133a9ae542d666d57

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact LiveContainer 3.8.10 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none https://github.com/LiveContainer/LiveContainer.git work/LiveContainer
          git -C work/LiveContainer checkout --detach "$LIVE_CONTAINER_REF"
          git -C work/LiveContainer submodule update --init --recursive --depth=1
          test "$(git -C work/LiveContainer rev-parse HEAD)" = "$LIVE_CONTAINER_REF"
          grep -Fq '<string>3.8.10</string>' work/LiveContainer/LiveContainer/Info.plist

      - name: Verify uploaded LiveContainer source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            "LiveContainer/Info.plist":"85e75f51497448242015a90cb201a4c83d86300fbd1adbb59341da74444379f6",
            "LiveContainerSwiftUI/App/AppDelegate.swift":"5cd7905f98bed0e9f829c57e1d5b2dce75b27bb53a95ffa881fb6f221c8cc43f",
            "LiveContainer.xcodeproj/project.pbxproj":"4d667ffe93d7a1797dac26a0716825050396fddd16ea3c91d2d4241196926cd9",
            ".github/build_github.sh":"4a83b9594c13e8f5d2de57433286f7381d4221961bbd4946c0699bcfbaed7e4f",
          }
          root=Path("work/LiveContainer")
          for rel, want in expected.items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert got==want, f"{rel}: source mismatch"
          print("Uploaded source identity: PASS")
          PY

      - name: Checkout exact SideStore 0.7.0 source
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          path: work/EmbeddedSideStore
          fetch-depth: 1
          submodules: recursive

      - name: Checkout exact AutoRefresh source
        uses: actions/checkout@v4
        with:
          repository: NRG-Wardog/sidestore-auto-refresh
          ref: ${{ env.AUTO_REFRESH_REF }}
          path: builder/upstream-autorefresh
          fetch-depth: 1

      - name: Verify SideStore submodules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C work/EmbeddedSideStore rev-parse HEAD)" = "$SIDESTORE_REF"
          test "$(git -C work/EmbeddedSideStore/Dependencies/minimuxer rev-parse HEAD)" = "$MINIMUXER_REF"
          test "$(git -C work/EmbeddedSideStore/Dependencies/SideSign rev-parse HEAD)" = "$SIDESIGN_REF"
          cp builder/upstream-autorefresh/scripts/*.py builder/
          cp -R builder/upstream-autorefresh/scripts/templates builder/
          cp builder/scripts/adapt_sidestore_070_signing.py builder/adapt_sidestore_070_signing.py
          swiftc -version

      - name: Checkout exact idevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice
          fetch-depth: 1
          submodules: recursive

      - name: Checkout exact jktcp
        uses: actions/checkout@v4
        with:
          repository: SideStore/jktcp
          ref: ${{ env.JKTCP_REF }}
          path: jktcp
          fetch-depth: 1

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid; fi
          if ! command -v bindgen >/dev/null 2>&1; then cargo install --locked bindgen-cli --version 0.72.1; fi
          rustup target add aarch64-apple-ios

      - name: Apply LiveContainer auto-refresh integration
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/patch_livecontainer_autorefresh.py work/LiveContainer
          python3 builder/scripts/patch_autorefresh_behavior.py work/LiveContainer
          # iOS 27: avoid the old PrivateIntentRunner execution path for the
          # refresh intent when SideStore is loaded in LiveProcess.
          python3 builder/scripts/patch_ios27_refresh_execution.py work/LiveContainer
          python3 builder/patch_embedded_sidestore_startup.py work/LiveContainer work/EmbeddedSideStore
          # iOS 27: open SideStore before executing the existing refresh action.
          # Do not alter RefreshAllAppsIntent or introduce unsupported
          # execution-target APIs.
          grep -Fq 'IOS27_OPEN_APP_BEFORE_REFRESH' 'work/LiveContainer/SideStoreSupport/PrivateIntentRunner.m'
          grep -Fq 'openAppWhenRun:openAppBeforeRefresh' 'work/LiveContainer/SideStoreSupport/PrivateIntentRunner.m'
          # AutoRefresh host scheduler depends on this shared model.
          cp builder/templates/combined_failure.swift work/LiveContainer/LiveContainerSwiftUI/Models/CombinedFailure.swift
          test -s work/LiveContainer/LiveContainerSwiftUI/Models/CombinedFailure.swift
          echo "LiveContainer post-integration localization already applied before compilation; skipping rewrite."
          python3 builder/scripts/force_autorefresh_runtime_localization.py work/LiveContainer
          swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
          swiftc -frontend -parse work/LiveContainer/SideStoreSupport/SideStoreClient.swift
          swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/LiveContainerAutoRefreshAlarm.swift
          plutil -lint work/LiveContainer/LiveContainer/Info.plist
          swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCEmbeddedSideStoreRefreshView.swift

      - name: Verify final Taiwan Traditional Chinese AutoRefresh source
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCEmbeddedSideStoreRefreshView.swift"
          test -s "$SETTINGS"
          swiftc -frontend -parse "$SETTINGS"
          swiftc -frontend -parse work/LiveContainer/SideStoreSupport/SideStoreClient.swift
          grep -Fq 'IOS27_DIRECT_REFRESH_INTENT' work/LiveContainer/SideStoreSupport/SideStoreClient.swift
          grep -Fq 'private func localizedRefreshError' "$SETTINGS" || true
          echo "Pre-build AutoRefresh source parse + iOS27 audit: PASS"

      - name: Build LiveContainer host
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project work/LiveContainer/LiveContainer.xcodeproj             -scheme LiveContainer -sdk iphoneos -configuration Release             -derivedDataPath "$RUNNER_TEMP/livecontainer-derived-data"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Apply CoreDevice idevice patches
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/patch_jktcp_reliability.py jktcp
          # The pinned modern SideStore/idevice already exports the CoreDevice + RPPairing FFI
          # consumed by minimuxer. The legacy compatibility patch targets the older 0.1.66
          # layout and aborts on the modern jktcp package anchor, so do not apply it here.
          ! grep -R -E 'rppairing_connect_quic|create_quic_listener|quinn::'             idevice/ffi/src/tunnel_provider.rs idevice/idevice/src/tunnel.rs
          grep -Fq 'tunnel_create_rppairing_with_options' idevice/ffi/src/tunnel_provider.rs
          grep -Fq 'pairable_host_prepare' idevice/ffi/src/pairing_host.rs

      - name: Test CoreDevice transport
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path jktcp/Cargo.toml
          cargo fmt --manifest-path idevice/ffi/Cargo.toml
          git -C jktcp diff --check
          git -C idevice diff --check
          cargo test --manifest-path jktcp/Cargo.toml --lib -- --skip tests::local_tcp --skip tests::handle_speed
          cargo check --manifest-path idevice/ffi/Cargo.toml --features obfuscate

      - name: Build IDevice.xcframework
        working-directory: idevice
        shell: bash
        run: |
          set -euo pipefail
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)"             IPHONEOS_DEPLOYMENT_TARGET=15.0             cargo build --release --target aarch64-apple-ios             --features obfuscate --manifest-path ffi/Cargo.toml
          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          rm -rf swift/IDevice.xcframework
          cp ffi/idevice.h swift/include/idevice.h
          xcodebuild -create-xcframework             -library target/aarch64-apple-ios/release/libidevice_ffi.a             -headers swift/include             -output swift/IDevice.xcframework

      - name: Apply upstream SideStore 0.7.0 CoreDevice integration
        shell: bash
        run: |
          set -euo pipefail
          SIDE=work/EmbeddedSideStore
          MUX="$SIDE/Dependencies/minimuxer"
          mkdir -p "$MUX/DeviceGateway/LocalBinary"
          rm -rf "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"
          cp -R idevice/swift/IDevice.xcframework "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"

          # SideStore 0.7.0+ contains the current pairing parser; do not apply the legacy pairing adapter.
          python3 builder/adapt_sidestore_070_signing.py "$SIDE"
          python3 -m py_compile builder/patch_background_automation.py
          python3 builder/scripts/run_background_automation_070.py "$SIDE"
          # SideStore 0.7.0+ already contains the current CoreDevice integration; skip the legacy patch.
          # iOS 27: apply this AFTER SideStore integration generation because
          # that generator can rewrite RefreshAllAppsIntent.swift.
          python3 builder/scripts/patch_sidestore_refresh_intent_ios27.py "$SIDE"
          INTENT="$SIDE/AltStore/Intents/App Intents/RefreshAllAppsIntent.swift"
          swiftc -frontend -parse "$INTENT"
          grep -Fq 'DPORT_IOS27_MAIN_PROCESS_REFRESH_V2' "$INTENT"
          grep -Fq 'allowedExecutionTargets' "$INTENT"
          grep -Fq '.main' "$INTENT"
          python3 builder/patch_local_idevice_package.py "$MUX"

          # SideStore 0.7.0+ already contains the upstream refresh pipeline used
          # by manual refresh. Do not require legacy V30 diagnostic markers.
          grep -Fq 'AppManager.shared.refresh' "$SIDE/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift"
          # SideStore 0.7.0 moved scheduling out of SceneDelegate; background automation shim above is the authoritative check.

          git -C "$MUX" diff --check
          swiftc -frontend -parse "$MUX/DeviceGateway/idevice/IdeviceGateway.swift"
          swiftc -frontend -parse "$MUX/Common/PairingProtocol.swift"
          swiftc -frontend -parse "$MUX/Sources/Services/NetworkObserverService.swift"
          swiftc -frontend -parse "$MUX/Sources/MinimuxerImpl.swift"
          swiftc -frontend -parse "$SIDE/SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift"
          swiftc -frontend -parse "$SIDE/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift"
          swiftc -frontend -parse "$SIDE/AltStore/AppDelegate.swift"

          # Final pass for SideStore after its integration scripts have generated
          # or rewritten Swift files. LiveContainer was already compiled.
          echo "Embedded SideStore post-integration localization already applied before compilation; skipping rewrite."

      - name: Build embedded SideStore
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies             -project work/EmbeddedSideStore/AltStore.xcodeproj             -scheme SideStore             -derivedDataPath "$RUNNER_TEMP/embedded-sidestore-derived-data"
          xcodebuild -project work/EmbeddedSideStore/AltStore.xcodeproj             -scheme SideStore -sdk iphoneos -configuration Release             -derivedDataPath "$RUNNER_TEMP/embedded-sidestore-derived-data"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package official-style LiveContainer+SideStore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 builder/scripts/package_livecontainer_sidestore.py             --source work/LiveContainer             --host "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app"             --side "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos/SideStore.app"             --output artifacts/LiveContainer-SideStore-AutoRefresh-Dicky.ipa
          python3 builder/scripts/audit_ipa_localization.py artifacts/LiveContainer-SideStore-AutoRefresh-Dicky.ipa

      - name: Final static audit
        shell: bash
        run: |
          set -euo pipefail
          # The legacy audit_ipa.py expects the obsolete [SIDESTORE_COREDEVICE]
          # diagnostic marker. Current SideStore 0.7.0 uses the actual IDevice
          # framework/symbol path instead, and the build has already validated
          # the modern CoreDevice FFI before packaging.
          python3 builder/scripts/audit_ipa_signing.py artifacts/LiveContainer-SideStore-AutoRefresh-Dicky.ipa
          python3 builder/scripts/audit_ipa_localization.py artifacts/LiveContainer-SideStore-AutoRefresh-Dicky.ipa

      - name: Upload IPA and audits
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-AutoRefresh-Dicky
          path: |
            artifacts/LiveContainer-SideStore-AutoRefresh-Dicky.ipa
          if-no-files-found: error
          retention-days: 14
